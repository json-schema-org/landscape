<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="JSON-tology JST TypeScript style clean node">

  <defs>
    <linearGradient id="nodeBlueGreen" x1="92" y1="36" x2="308" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FE7D8"/>
      <stop offset="0.5" stop-color="#24A5B5"/>
      <stop offset="1" stop-color="#08717A"/>
    </linearGradient>

    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <style>
      .label {
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
        font-weight: 700;
        letter-spacing: -0.075em;
      }

      .circuit {
        fill: none;
        stroke: #BDF6F2;
        stroke-width: 5;
        stroke-linecap: square;
        stroke-linejoin: miter;
        opacity: 0.62;
      }

      .caption {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        fill: #DDFBFF;
      }
    </style>
  </defs>

  <g id="json-tology-jst-node" filter="url(#nodeShadow)">

    <g id="faceted-nodejs-style-hex">
      <path id="node-base" d="M200 24 L352.4 112 L352.4 288 L200 376 L47.6 288 L47.6 112 Z" fill="url(#nodeBlueGreen)"/>
      <path id="facet-top-left" d="M200 24 L47.6 112 L112 149 L200 98 Z" fill="#FFFFFF" opacity="0.16"/>
      <path id="facet-top-right" d="M200 24 L352.4 112 L288 149 L200 98 Z" fill="#FFFFFF" opacity="0.08"/>
      <path id="facet-left" d="M47.6 112 L112 149 L200 376 L47.6 288 Z" fill="#003E46" opacity="0.14"/>
      <path id="facet-right" d="M352.4 112 L288 149 L200 376 L352.4 288 Z" fill="#003E46" opacity="0.20"/>
      <path id="facet-center" d="M112 149 L200 98 L288 149 L200 376 Z" fill="#FFFFFF" opacity="0.07"/>
      <path id="hex-outline" d="M200 24 L352.4 112 L352.4 288 L200 376 L47.6 288 L47.6 112 Z" fill="none" stroke="#DDFBFF" stroke-width="6" opacity="0.78"/>
    </g>


    <g id="jst-typescript-style-label">
      <text id="jst-label" class="label" x="203" y="264" text-anchor="middle" font-size="142" fill="#FFFFFF">JST</text>
    </g>

  </g>
</svg>
